name: Gaming PC Deal Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for verified deals
        env:
          MAX_PRICE: "1500"
          CHECK_MINUTES: "10"
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gaming_pc_deal_watcher.py --once
      - name: Remember which deals were already sent
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add seen_deals.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update seen deals"
            git pull --rebase origin main
            git push
          fi
